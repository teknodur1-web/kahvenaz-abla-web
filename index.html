Done\":\"Fotoğraf hazır\",\"palmTip\":\"Çok kullandığın elini, aydınlık bir yerde, parmakların hafif açık şekilde çek.\",\"questionOpt\":\"Sorun (isteğe bağlı)\",\"questionOptPh\":\"ör. Bu ilişki nereye gidiyor?\",\"fromProfile\":\"Adın ve doğum tarihin profilinden alınır: Ayşe · 05.12.1994\",\"spreadTitle\":\"Açılımını seç\",\"pickTitle\":{\"one\":\"{n} kart seç\",\"other\":\"{n} kart seç\"},\"pickSub\":\"78 kartlık deste karıştırıldı. Gözünü kapat, içinden gelenlere dokun.\",\"deckInfo\":\"22 Büyük Arkana · 56 Küçük Arkana · ters kartlar dahil\",\"shuffle\":\"Yeniden karıştır\",\"openCards\":\"Kartlarımı aç\",\"adviceTitle\":\"Kahvenaz Abla'nın önerisi\",\"scoreLabel\":\"Uyum puanı\",\"starLabel\":\"Yıldızın\",\"starCalc\":\"Ebced toplamı 838 · 12’ye bölümden kalan 10\",\"reversed\":\"ters\",\"yourCards\":\"Kartların\",\"needInput\":\"Önce bilgileri doldur canım.\",\"needPalm\":\"Önce avucunun fotoğrafını çek.\",\"premiumOn\":\"Prototip: Premium açıldı.\",\"usedWelcome\":\"Hoş geldin hakkın kullanıldı.\",\"fal\":{\"tarot\":{\"about\":\"Tarot 78 kartlık bir destedir. Büyük Arkana'nın 22 kartı hayatın büyük derslerini, Küçük Arkana'nın 56 kartı gündelik hayatı anlatır: Değnekler tutku ve işi, Kupalar duyguları, Kılıçlar düşünceleri, Tılsımlar parayı ve somut hayatı. Ters gelen kart bir uyarıyı ya da gecikmeyi gösterir. Kartlar geleceği kesin olarak söylemez, bugünkü durumunu farklı bir açıdan görmeni sağlar. Kahvenaz Abla, kartları senin için karıştırır ve sorunla birlikte yorumlar.\",\"steps\":[\"Açılımını seç: 1, 3 ya da 7 kart.\",\"Sorunu düşün ve içinden gelen kartlara dokun.\",\"Her kartı yerine göre okuyup sana özel yorumu yazarım.\"],\"learn\":[\"Konunun geçmişi, bugünü ve gidişatı\",\"Seni zorlayan engel ve sana destek olan güç\",\"Bir sonraki adım için somut bir öneri\"],\"sample\":{\"title\":\"Umut, seçim ve aydınlık\",\"summary\":\"Ayşe, kartların zor bir dönemin kapandığını ve kalbinin yeniden açıldığını söylüyor.\",\"sections\":[[\"Geçmiş · Yıldız\",\"Yorulduğun bir dönemden çıktın; içindeki umut hiç sönmemiş. Bu kart iyileşmenin başladığını gösteriyor.\"],[\"Şimdi · Aşıklar\",\"Önünde bir seçim var. Aklınla kalbin aynı yöne bakarsa doğru kapıyı açarsın.\"],[\"Gelecek · Güneş\",\"Önündeki haftalar aydınlık. Emeklerinin karşılığını görme ihtimalin yüksek.\"]],\"advice\":[\"Kararını aceleye getirme ama sonsuza dek de erteleme.\",\"Seni gülümseten insanlara daha çok vakit ayır.\"]}},\"ask\":{\"about\":\"Aşk falı yalnızca kalbine odaklanır. Kahvenaz Abla, ilişki durumunu, burcunu ve sorunu birlikte ele alarak duygusal hayatındaki akışı yorumlar. Bekarsan yeni bir kalbin yolunu, ilişkin varsa bağınızın güçlü ve kırılgan yanlarını anlatır.\",\"steps\":[\"Profilindeki ilişki durumun ve burcun okunur.\",\"İstersen merak ettiğin şeyi tek cümleyle yaz.\",\"Aşk hayatına özel, bölüm bölüm bir yorum yazarım.\"],\"learn\":[\"Kalbinin şu anki hâli ve neye ihtiyaç duyduğu\",\"Yaklaşan bir karşılaşma ya da ilişkindeki yeni dönem\",\"Sevgini daha iyi anlatmanın yolları\"],\"sample\":{\"title\":\"Kalbin yeni bir sayfaya hazır\",\"summary\":\"Ayşe, geçmişin ağırlığını bırakıyorsun; kalbin hafifledikçe doğru insanı fark etmen kolaylaşacak.\",\"sections\":[[\"Kalbinin hâli\",\"Son aylarda kendini korumaya aldın. Bu bir zayıflık değil, iyileşmenin parçası.\"],[\"Yakın dönem\",\"Arkadaş ortamından gelen bir tanışma ya da beklenmedik bir mesaj kalbini kıpırdatabilir.\"],[\"Dikkat etmen gereken\",\"Eskiyi yeniyle kıyaslama; yeni gelen kişiyi kendi hikâyesiyle tanı.\"]],\"advice\":[\"Davetlere \\\"evet\\\" demeyi dene.\",\"Ne istediğini bir kâğıda yaz; netlik çekim yaratır.\"]}},\"aklindaki_kisi\":{\"about\":\"Aklındaki Kişi falı, düşüncelerinden çıkmayan biriyle aranızdaki bağa bakar. Kişinin adını ve onunla ilişkini yazarsın; Kahvenaz Abla aranızdaki enerjiyi ve yakın dönemi yorumlar. Onun duyguları hakkında kesin konuşmaz, olasılıkları ve sana düşen adımı anlatır.\",\"steps\":[\"Aklındaki kişinin adını yaz.\",\"İstersen onunla ilişkini ekle: eski sevgili, arkadaş, iş arkadaşı…\",\"Aranızdaki bağı ve yakın dönemi kısa ve net yorumlarım.\"],\"learn\":[\"Aranızdaki bağın bugünkü hâli\",\"Yakın dönemde ilişkinizde neyin değişebileceği\",\"Senin için en sağlıklı adım\"],\"sample\":{\"title\":\"Mert ve sen: yarım kalmış bir cümle\",\"summary\":\"Aranızda söylenmemiş sözler var; ikiniz de ilk adımı karşı taraftan bekliyorsunuz.\",\"sections\":[[\"Aranızdaki bağ\",\"Bağınız kopmamış ama sessizleşmiş. Ortak anılar ikinizi de hâlâ yumuşatıyor.\"],[\"Yakın dönem\",\"Önümüzdeki haftalarda küçük bir vesile, bir mesaj ya da ortak bir arkadaş, iletişimi açabilir.\"],[\"Sana düşen\",\"Beklemek yerine kendi ihtiyacını netleştir; cevabı ne olursa olsun huzur bulacaksın.\"]],\"advice\":[\"Israrcı olma, samimi ol.\",\"Kendi hayatına odaklandıkça bağın gerçek yüzünü göreceksin.\"]}},\"uyum\":{\"about\":\"İlişki uyumu, iki kişinin burçlarını, burçların elementlerini (ateş, toprak, hava, su) ve numerolojideki yaşam yolu sayılarını karşılaştırır. Uyum puanı aynı iki kişi için hep aynı çıkar. Puan eğlence amaçlıdır; asıl değerli olan güçlü yanlarınız ve birlikte nasıl büyüyebileceğinizdir.\",\"steps\":[\"Senin doğum tarihin profilinden alınır.\",\"Onun adını ve doğum tarihini yaz.\",\"Uyum puanınızı, güçlü yanlarınızı ve sürtünme noktalarınızı anlatırım.\"],\"learn\":[\"Burç ve element uyumunuz\",\"İlişkinizin güçlü yanları ve zorlanabileceğiniz konular\",\"Birlikte büyümek için öneriler\"],\"sample\":{\"title\":\"İki ateş, tek ocak\",\"summary\":\"Ayşe (Yay) ve Mert (Koç): ikiniz de ateş elementisiniz; heyecan ve cesaret bu bağın yakıtı.\",\"sections\":[[\"Güçlü yanlarınız\",\"Birbirinizi harekete geçiriyorsunuz. Macera, yolculuk ve yeni planlar sizi yakınlaştırır.\"],[\"Sürtünme noktaları\",\"İkiniz de son sözü söylemek isteyebilirsiniz. Tartışmada kazanmak yerine anlamayı seçin.\"],[\"Birlikte büyümek\",\"Sakin anlara da yer açın; birlikte susabilmek de bir uyumdur.\"]],\"advice\":[\"Haftada bir telefonsuz bir akşam planlayın.\",\"Kızgınken değil, sakinleşince konuşun.\"]}},\"katina\":{\"about\":\"Katina, Türkiye ve Yunanistan'da aşk için bakılan bir semboller destesidir. Kahvenaz Abla kendi 24 sembollük destesini kullanır: kalp, mektup, yüzük, yol, anahtar… Yedi kart kalp şeklinde açılır; ters gelen kartlar o konunun gölgede kalan yanını anlatır.\",\"steps\":[\"İstersen aşk hayatınla ilgili sorunu yaz.\",\"Kartlar karıştırılır ve yedi kart kalp açılımına dizilir.\",\"Her kartı yerine göre okur, aşk hayatına özel yorumlarım.\"],\"learn\":[\"Senin ve onun kalbinden geçenler\",\"Aranızdaki bağ, engel ve sana yardım edecek güç\",\"Yakın gelecek ve olası sonuç\"],\"sample\":{\"title\":\"Kalbin ve bir mektup\",\"summary\":\"Ayşe, açılım sevginin karşılıksız olmadığını ama iletişimin biraz bulutlu olduğunu söylüyor.\",\"sections\":[[\"İkinizin kalbi · Kalp ve Mektup\",\"Senin kalbin açık; onun tarafında söylenmeyi bekleyen bir duygu var. Bir haber ya da itiraf yakın.\"],[\"Bağ ve engel · Köprü, ters Bulut\",\"Aranızda bir köprü kurulmuş. Ters Bulut, kaygıların dağılmaya başladığını gösteriyor.\"],[\"Yakın gelecek ve sonuç · Yol ve Yüzük\",\"Yeni bir başlangıç ve ciddi bir niyet görünüyor; acele etmeden ilerlersen bağ güçlenir.\"]],\"advice\":[\"Duygunu küçük bir jestle göster.\",\"Kaygını değil, isteğini anlat.\"]}},\"numeroloji\":{\"about\":\"Numeroloji, adındaki harflerin ve doğum tarihindeki rakamların sayısal değerine bakar. Yaşam yolu sayın doğum tarihinden, ifade sayın adının bütün harflerinden, ruh güdüsü sayın sesli harflerden hesaplanır. Hesap sunucuda, kesin kurallarla yapılır; Kahvenaz Abla sayıların anlamını hayatına bağlar.\",\"steps\":[\"Adın ve doğum tarihin profilinden alınır.\",\"Üç ana sayın hesaplanır (11, 22 ve 33 usta sayı olarak korunur).\",\"Her sayının sende nasıl göründüğünü yorumlarım.\"],\"learn\":[\"Hayat yolculuğunun ana teması\",\"Doğal yeteneklerin ve kendini ifade biçimin\",\"Kalbinin derinde istediği şey\"],\"sample\":{\"title\":\"Yaşam yolu 4: sağlam temeller\",\"summary\":\"Ayşe, sayıların emekle kurulan, kalıcı başarılara işaret ediyor; içinde de özgürlük isteyen bir ruh var.\",\"sections\":[[\"Yaşam yolu 4\",\"Planlı, güvenilir ve sabırlısın. İnsanlar sana yaslanır; bazen yükünü paylaşmayı unutma.\"],[\"İfade sayısı 7\",\"Derin düşünen, sorgulayan bir zihnin var. Yalnız kaldığında en iyi fikirlerini bulursun.\"],[\"Ruh güdüsü 5\",\"Kalbin yenilik ve hareket istiyor. Rutinin içine küçük maceralar eklemelisin.\"]],\"advice\":[\"Bu ay yeni bir şey öğrenmeye başla.\",\"Planlarına esneklik payı bırak.\"]}},\"yildizname\":{\"about\":\"Yıldızname, Osmanlı'dan bu yana bakılan geleneksel bir yorumdur. Adının ve annenin adının harf değerleri (Ebced) toplanır, 12'ye bölünür; kalan sayı yıldızını, yani burcunu ve gezegenini verir. Kahvenaz Abla bu yıldızla karakterini, içinde bulunduğun dönemi ve dikkat etmen gerekenleri yorumlar.\",\"steps\":[\"Adın ve doğum tarihin profilinden alınır, annenin adını yazarsın.\",\"Ebced toplamı hesaplanır ve yıldızın bulunur.\",\"Yıldızına göre karakterini, aşkını, işini ve bu dönemi yorumlarım.\"],\"learn\":[\"Yıldızın, gezegenin ve elementin\",\"Karakterinin güçlü ve hassas yanları\",\"Bu dönemde aşk, iş ve kısmet\"],\"sample\":{\"title\":\"Yıldızın Oğlak, gezegenin Zühal\",\"summary\":\"Ayşe, yıldızın sabrı ve kalıcı başarıyı anlatıyor; bu dönem emeklerinin meyve verdiği bir zaman.\",\"sections\":[[\"Karakterin\",\"Ağır başlı ama sıcak kalplisin. Söz verdiğinde tutarsın; bu yüzden insanlar sana güvenir.\"],[\"Bu dönem\",\"Uzun zamandır uğraştığın bir iş netleşiyor. Küçük bir terfi ya da takdir gelebilir.\"],[\"Aşk ve kısmet\",\"Ciddi ve güvenilir birine yakınlık duyacaksın. Acele etmeden tanımak sana iyi gelecek.\"]],\"advice\":[\"Kendine de söz ver ve tut.\",\"Yorulduğunda dinlenmeyi bir ödül değil, ihtiyaç say.\"]}},\"ruya\":{\"about\":\"Rüya tabiri, rüyandaki sembolleri Doğu’nun yüzyıllık tabir geleneğiyle ve rüyanın sende uyandırdığı duygularla birlikte yorumlar. Kâbuslar uğursuzluk  of the past; as your heart grows lighter, you'll find it easier to notice the right person.\",\"sections\":[[\"Your heart\",\"Lately you've been protecting yourself. That isn't weakness; it's part of healing.\"],[\"Coming weeks\",\"An introduction through friends or an unexpected message may stir your heart.\"],[\"Keep in mind\",\"Don't compare the new with the old; get to know the newcomer through their own story.\"]],\"advice\":[\"Try saying \\\"yes\\\" to invitations.\",\"Write down what you want; clarity is magnetic.\"]}},\"aklindaki_kisi\":{\"about\":\"On Your Mind looks at your bond with a person you can't stop thinking about. You write their name and your connection; Kahvenaz Abla reads the energy between you and the near future. It never claims to know their feelings for sure; it speaks of possibilities and of the step that is yours to take.\",\"steps\":[\"Write the person's name.\",\"Optionally add your connection: ex, friend, colleague…\",\"I read your bond and the near future, short and clear.\"],\"learn\":[\"Where your bond stands today\",\"What may change between you soon\",\"The healthiest step for you\"],\"sample\":{\"title\":\"Mert and you: an unfinished sentence\",\"summary\":\"Some words between you remain unsaid; you are both waiting for the other to make the first move.\",\"sections\":[[\"Your bond\",\"The bond hasn't broken, but it has gone quiet. Shared memories still soften you both.\"],[\"Near future\",\"In the coming weeks a small occasion, a message or a mutual friend could reopen the conversation.\"],[\"Your part\",\"Instead of waiting, get clear on what you need; whatever the answer, you will find peace.\"]],\"advice\":[\"Be sincere, not insistent.\",\"The more you focus on your own life, the more clearly you will see the bond.\"]}},\"uyum\":{\"about\":\"Compatibility compares two people’s zodiac signs, their elements (fire, earth, air, water) and their numerology life path numbers. The score is always the same for the same two people. I eversed Cloud shows worries starting to clear.\"],[\"Near future and outcome · Road and Ring\",\"A new beginning and serious intentions appear; move without rushing and the bond grows stronger.\"]],\"advice\":[\"Show your feelings with a small gesture.\",\"Talk about what you want, not what you fear.\"]}},\"numeroloji\":{\"about\":\"Numerology looks at the number values of the letters in your name and the digits of your birth date. Your life path number comes from your birth date, your expression number from all the letters of your name and your soul urge number from its vowels. The maths is done on our server with fixed rules; Kahvenaz Abla links the meaning of the numbers to your life.\",\"steps\":[\"Your name and birth date come from your profile.\",\"Your three core numbers are calculated (11, 22 and 33 stay as master numbers).\",\"I interpret how each number shows up in you.\"],\"learn\":[\"The main theme of your life journey\",\"Your natural talents and how you express yourself\",\"What your heart truly longs for\"],\"sample\":{\"title\":\"Life path 4: solid foundations\",\"summary\":\"Ayşe, your numbers point to lasting success built through effort, with a free spirit inside.\",\"sections\":[[\"Life path 4\",\"You are organised, reliable and patient. People lean on you; remember to share the load sometimes.\"],[\"Expression number 7\",\"You have a deep, questioning mind. Your best ideas come when you are alone.\"],[\"Soul urge 5\",\"Your heart wants novelty and movement. Add small adventures to your routine.\"]],\"advice\":[\"Start learning something new this month.\",\"Leave some flexibility in your plans.\"]}},\"yildizname\":{\"about\":\"The star reading (Yıldızname) is a traditional practice dating back to Ottoman times. The letter values (abjad) of your name and your mother's name are added up and divided by 12; the remainder gives your star, meaning your sign and ruling planet. Kahvenaz Abla reads your character, your current period and what to watch for n guter Tag für etwas Kreatives.\"],\"guide\":[[\"Umdrehen und warten.\",\"Trink deinen Kaffee, wünsch dir etwas, stell die Tasse kopfüber auf die Untertasse; 5–10 Minuten abkühlen lassen.\"],[\"Auf das Licht achten.\",\"An einem hellen Ort ohne Blitz fotografieren; kein Schatten auf der Tasse.\"],[\"Von oben fotografieren.\",\"Die Tasse soll das Bild füllen, der Satz gut sichtbar sein.\"],[\"Drei Fotos.\",\"Die Tasse innen von links und rechts, dann die Untertasse.\"]],\"symbols\":[[\"Vogel\",\"Bedeutet Neuigkeiten; am linken Rand, also bald.\"],[\"Weg\",\"Eine kurze Reise oder ein Neuanfang.\"],[\"Herz\",\"Ein Gefühl, das du in dir trägst, wird erwidert.\"]],\"outcomes\":[\"Ja\",\"Teilweise\",\"Nein\"],\"reasons\":[\"Unangemessen oder verletzend\",\"Beängstigend oder beunruhigend\",\"Rat zu Gesundheit, Recht oder Geld\",\"Hat nichts mit mir zu tun\",\"Sonstiges\"],\"links\":[\"Datenschutzerklärung\",\"Datenschutzhinweis (KVKK)\",\"Hilfe und Kontakt\",\"Konto löschen\"],\"consentTitle\":\"Vor deiner Deutung\",\"consentText\":\"Damit wir deine Deutungen schreiben können, werden deine Fotos und Texte verschlüsselt an unseren KI-Anbieter Anthropic (USA) übermittelt. Details in der Datenschutzerklärung.\",\"consentYes\":\"Ich stimme zu\",\"consentLater\":\"Später\",\"toast\":{\"soon\":\"{x} kommt bald\",\"tarot\":\"Tageskarte: Der Stern. Hoffnung und Heilung.\",\"saved\":\"Deine Deutung ist fertig und gespeichert\",\"noQuestion\":\"Schreib zuerst deine Frage\",\"needCredit\":\"Dafür brauchst du 1 Credit\",\"streak\":\"Komm täglich vorbei: Tag 3 bringt 1, Tag 7 bringt 2 Credits. Verpasst du einen Tag, beginnt die Serie neu.\",\"outcome\":\"Danke, deine Auswertung wurde ergänzt\",\"report\":\"Danke, deine Meldung wird geprüft\",\"buy\":\"Google-Play-Kasse öffnet sich ({x})\",\"edit\":\"Name, Geburtsdatum, Beziehung und Interessen bearbeiten\",\"share\":\"Teilen öffnet sich: „Mein Kahvenaz-Abla-Code: KNZ-7Q4MP“\",\"redeem\":\"Codeeingabe öffnet sich (nur vor der ersten De otografieren\",\"palmDone\":\"Foto bereit\",\"palmTip\":\"Fotografiere deine Haupthand bei gutem Licht, die Finger leicht gespreizt.\",\"questionOpt\":\"Deine Frage (optional)\",\"questionOptPh\":\"z. B. Wohin führt diese Beziehung?\",\"fromProfile\":\"Name und Geburtsdatum kommen aus deinem Profil: Ayşe · 05.12.1994\",\"spreadTitle\":\"Wähle deine Legung\",\"pickTitle\":{\"one\":\"Wähle {n} Karte\",\"other\":\"Wähle {n} Karten\"},\"pickSub\":\"Das Deck aus 78 Karten ist gemischt. Schließ die Augen und tippe auf die, die dich rufen.\",\"deckInfo\":\"22 Große Arkana · 56 Kleine Arkana · mit umgekehrten Karten\",\"shuffle\":\"Neu mischen\",\"openCards\":\"Karten aufdecken\",\"adviceTitle\":\"Rat von Kahvenaz Abla\",\"scoreLabel\":\"Harmoniewert\",\"starLabel\":\"Dein Stern\",\"starCalc\":\"Abdschad-Summe 838 · Rest 10 bei Teilung durch 12\",\"reversed\":\"umgekehrt\",\"yourCards\":\"Deine Karten\",\"needInput\":\"Füll zuerst die Angaben aus, meine Liebe.\",\"needPalm\":\"Fotografiere zuerst deine Handfläche.\",\"premiumOn\":\"Prototyp: Premium aktiviert.\",\"usedWelcome\":\"Eine Willkommensdeutung wurde genutzt.\",\"fal\":{\"tarot\":{\"about\":\"Tarot ist ein Deck aus 78 Karten. Die 22 Karten der Großen Arkana erzählen von den großen Lektionen des Lebens, die 56 Karten der Kleinen Arkana vom Alltag: Stäbe für Leidenschaft und Arbeit, Kelche für Gefühle, Schwerter für Gedanken, Münzen für Geld und das praktische Leben. Eine umgekehrte Karte zeigt eine Warnung oder eine Verzögerung. Die Karten sagen die Zukunft nicht sicher voraus, sie lassen dich deine Lage aus einem neuen Blickwinkel sehen. Kahvenaz Abla mischt die Karten für dich und deutet sie zusammen mit deiner Frage.\",\"steps\":[\"Wähle deine Legung: 1, 3 oder 7 Karten.\",\"Denk an deine Frage und tippe auf die Karten, die dich rufen.\",\"Ich deute jede Karte an ihrem Platz und schreibe eine Deutung nur für dich.\"],\"learn\":[\"Vergangenheit, Gegenwart und Richtung des Themas\",\"Was dich bremst und was dich stärkt\",\"Einen konkreten Vorschlag für deinen nächsten Schritt\"],\"sample\":{\"title\":\"Hoffnung, Wahl und Licht\",\"summary\":\"Ayşe, deine Karten sagen: Ein schweres Kapitel schließt sich, und dein Herz öffnet sich wieder.\",\"sections\":[[\"Vergangenheit · Der Stern\",\"Du hast eine anstrengende Zeit hinter dir; deine Hoffnung ist nie erloschen. Diese Karte zeigt, dass die Heilung begonnen hat.\"],[\"Gegenwart · Die Liebenden\",\"Vor dir liegt eine Entscheidung. Wenn Kopf und Herz in dieselbe Richtung schauen, öffnest du die richtige Tür.\"],[\"Zukunft · Die Sonne\",\"Die kommenden Wochen sehen hell aus. Wahrscheinlich wird sich deine Mühe auszahlen.\"]],\"advice\":[\"Triff deine Entscheidung nicht überstürzt, aber schieb sie auch nicht ewig auf.\",\"Verbringe mehr Zeit mit Menschen, die dich zum Lächeln bringen.\"]}},\"ask\":{\"about\":\"Die Liebesdeutung konzentriert sich ganz auf dein Herz. Kahvenaz Abla betrachtet deinen Beziehungsstatus, dein Sternzeichen und deine Frage gemeinsam und deutet den Fluss deines Liebeslebens. Bist du Single, geht es um den Weg zu einer neuen Liebe; bist du in einer Beziehung, um die Stärken und empfindlichen Stellen eurer Bindung.\",\"steps\":[\"Beziehungsstatus und Sternzeichen werden aus deinem Profil gelesen.\",\"Wenn du möchtest, schreib deine Frage in einem Satz.\",\"Ich schreibe eine Deutung deines Liebeslebens, Abschnitt für Abschnitt.\"],\"learn\":[\"Wie es deinem Herzen geht und was es braucht\",\"Eine nahende Begegnung oder ein neues Kapitel in deiner Beziehung\",\"Wege, deine Liebe besser zu zeigen\"],\"sample\":{\"title\":\"Dein Herz ist bereit für eine neue Seite\",\"summary\":\"Ayşe, du lässt die Vergangenheit los; je leichter dein Herz wird, desto eher erkennst du den richtigen Menschen.\",\"sections\":[[\"Dein Herz\",\"In den letzten Monaten hast du dich geschützt. Das ist keine Schwäche, sondern Teil der Heilung.\"],[\"Die nächsten Wochen\",\"Eine Begegnung im Freundeskreis oder eine unerwartete Nachricht könnte dein Herz bewegen.\"],[\"Achte darauf\",\"Vergleiche das Neue nicht mit dem Alten; lerne den neuen Menschen mit seiner eigenen Geschichte kennen.\"]],\"advice\":[\"Sag öfter „ja“ zu Einladungen.\",\"Schreib auf, was du dir wünschst; Klarheit zieht an.\"]}},\"aklindaki_kisi\":{\"about\":\"Im Herzen betrachtet deine Verbindung zu einem Menschen, der dir nicht aus dem Kopf geht. Du gibst den Namen und eure Verbindung ein; Kahvenaz Abla deutet die Energie zwischen euch und die nahe Zukunft. Über seine oder ihre Gefühle spricht sie nie mit Gewissheit, sondern über Möglichkeiten und deinen eigenen Schritt.\",\"steps\":[\"Schreib den Namen der Person.\",\"Füge auf Wunsch eure Verbindung hinzu: Ex, Freund, Kollege …\",\"Ich deute eure Verbindung und die nahe Zukunft, kurz und klar.\"],\"learn\":[\"Wo eure Verbindung heute steht\",\"Was sich zwischen euch bald ändern kann\",\"Den gesündesten Schritt für dich\"],\"sample\":{\"title\":\"Mert und du: ein unvollendeter Satz\",\"summary\":\"Zwischen euch ist manches ungesagt geblieben; ihr wartet beide darauf, dass der andere den ersten Schritt macht.\",\"sections\":[[\"Eure Verbindung\",\"Die Verbindung ist nicht gerissen, aber still geworden. Gemeinsame Erinnerungen machen euch beide noch weich.\"],[\"Nahe Zukunft\",\"In den kommenden Wochen könnte ein kleiner Anlass, eine Nachricht oder ein gemeinsamer Freund das Gespräch wieder öffnen.\"],[\"Dein Teil\",\"Statt zu warten, werde dir klar, was du brauchst; wie die Antwort auch ausfällt, du wirst Frieden finden.\"]],\"advice\":[\"Sei ehrlich, nicht aufdringlich.\",\"Je mehr du dich auf dein eigenes Leben konzentrierst, desto klarer siehst du die Verbindung.\"]}},\"uyum\":{\"about\":\"Die Partnerschaftsanalyse vergleicht die Sternzeichen zweier Menschen, ihre Elemente (Feuer, Erde, Luft, Wasser) und ihre Lebenszahlen aus der Numerologie. Für dieselben zwei Menschen ergibt sich immer derselbe Wert. Er ist zur Unterhaltung gedacht; wirklich wertvoll sind eure Stärken und wie ihr gemeinsam wachsen könnt.\",\"steps\":[\"Dein Geburtsdatum kommt aus deinem Profil.\",\"Gib Namen und Geburtsdatum der anderen Person ein.\",\"Ich beschreibe euren Wert, eure Stärken und eure Reibungspunkte.\"],\"learn\":[\"Wie eure Sternzeichen und Elemente zusammenpassen\",\"Stärken eurer Beziehung und mögliche Reibungen\",\"Tipps, um gemeinsam zu wachsen\"],\"sample\":{\"title\":\"Zwei Feuer, ein Herd\",\"summary\":\"Ayşe (Schütze) und Mert (Widder): Ihr seid beide Feuerzeichen; Begeisterung und Mut treiben diese Bindung an.\",\"sections\":[[\"Eure Stärken\",\"Ihr spornt euch gegenseitig an. Abenteuer, Reisen und neue Pläne bringen euch näher.\"],[\"Reibungspunkte\",\"Vielleicht wollt ihr beide das letzte Wort haben. Wählt im Streit Verständnis statt Sieg.\"],[\"Gemeinsam wachsen\",\"Schafft auch Raum für ruhige Momente; gemeinsam schweigen zu können ist auch Harmonie.\"]],\"advice\":[\"Plant einen handyfreien Abend pro Woche.\",\"Sprecht miteinander, wenn ihr euch beruhigt habt, nicht im Ärger.\"]}},\"katina\":{\"about\":\"Katina ist ein Symboldeck, mit dem man in der Türkei und in Griechenland die Liebe deutet. Kahvenaz Abla nutzt ihr eigenes Deck mit 24 Symbolen: Herz, Brief, Ring, Weg, Schlüssel … Sieben Karten werden in Herzform gelegt; umgekehrte Karten zeigen die Schattenseite eines Themas.\",\"steps\":[\"Schreib auf Wunsch deine Frage zur Liebe.\",\"Die Karten werden gemischt und sieben in die Herzlegung gelegt.\",\"Ich deute jede Karte an ihrem Platz und dein Liebesleben.\"],\"learn\":[\"Was in deinem und seinem/ihrem Herzen ist\",\"Eure Verbindung, das Hindernis und die helfende Kraft\",\"Die nahe Zukunft und das mögliche Ergebnis\"],\"sample\":{\"title\":\"Dein Herz und ein Brief\",\"summary\":\"Ayşe, die Legung sagt: Die Liebe ist nicht einseitig, aber die Kommunikation ist etwas bewölkt.\",\"sections\":[[\"Beide Herzen · Herz und Brief\",\"Dein Herz ist offen; auf der anderen Seite wartet ein Gefühl darauf, ausgesprochen zu werden. Eine Nachricht oder ein Geständnis ist nah.\"],[\"Verbindung und Hindernis · Brücke, umgekehrte Wolke\",\"Zwischen euch ist eine Brücke entstanden. Die umgekehrte Wolke zeigt, dass sich Sorgen aufzulösen beginnen.\"],[\"Nahe Zukunft und Ergebnis · Weg und Ring\",\"Ein Neubeginn und ernste Absichten zeigen sich; geht ohne Eile weiter, dann wird die Bindung stärker.\"]],\"advice\":[\"Zeig deine Gefühle mit einer kleinen Geste.\",\"Sprich über deinen Wunsch, nicht über deine Angst.\"]}},\"numeroloji\":{\"about\":\"Die Numerologie betrachtet die Zahlenwerte der Buchstaben deines Namens und der Ziffern deines Geburtsdatums. Deine Lebenszahl ergibt sich aus dem Geburtsdatum, deine Ausdruckszahl aus allen Buchstaben deines Namens und deine Seelenzahl aus den Vokalen. Gerechnet wird auf unserem Server nach festen Regeln; Kahvenaz Abla verbindet die Bedeutung der Zahlen mit deinem Leben.\",\"steps\":[\"Name und Geburtsdatum kommen aus deinem Profil.\",\"Deine drei Kernzahlen werden berechnet (11, 22 und 33 bleiben Meisterzahlen).\",\"Ich deute, wie sich jede Zahl in dir zeigt.\"],\"learn\":[\"Das Hauptthema deines Lebenswegs\",\"Deine natürlichen Talente und wie du dich ausdrückst\",\"Wonach sich dein Herz wirklich sehnt\"],\"sample\":{\"title\":\"Lebenszahl 4: feste Fundamente\",\"summary\":\"Ayşe, deine Zahlen weisen auf dauerhaften Erfolg durch Fleiß hin, mit einem freiheitsliebenden Geist im Inneren.\",\"sections\":[[\"Lebenszahl 4\",\"Du bist organisiert, zuverlässig und geduldig. Andere lehnen sich an dich an; denk daran, die Last manchmal zu teilen.\"],[\"Ausdruckszahl 7\",\"Du hast einen tiefen, fragenden Geist. Deine besten Ideen kommen dir, wenn du allein bist.\"],[\"Seelenzahl 5\",\"Dein Herz will Neues und Bewegung. Bau kleine Abenteuer in deinen Alltag ein.\"]],\"advice\":[\"Fang diesen Monat an, etwas Neues zu lernen.\",\"Lass in deinen Plänen Raum für Flexibilität.\"]}},\"yildizname\":{\"about\":\"Die Sterndeutung (Yıldızname) ist eine traditionelle Praxis aus osmanischer Zeit. Die Buchstabenwerte (Abdschad) deines Namens und des Namens deiner Mutter werden addiert und durch 12 geteilt; der Rest ergibt deinen Stern, also dein Zeichen und deinen Planeten. Kahvenaz Abla deutet über diesen Stern deinen Charakter, deine aktuelle Phase und worauf du achten solltest.\",\"steps\":[\"Name und Geburtsdatum kommen aus deinem Profil, den Namen deiner Mutter gibst du ein.\",\"Die Abdschad-Summe wird berechnet und dein Stern bestimmt.\",\"Ich deute Charakter, Liebe, Arbeit und diese Phase anhand deines Sterns.\"],\"learn\":[\"Dein Stern, dein Planet und dein Element\",\"Starke und empfindsame Seiten deines Charakters\",\"Liebe, Arbeit und Glück in dieser Phase\"],\"sample\":{\"title\":\"Dein Stern ist Steinbock, dein Planet Saturn\",\"summary\":\"Ayşe, dein Stern spricht von Geduld und dauerhaftem Erfolg; jetzt tragen deine Mühen Früchte.\",\"sections\":[[\"Dein Charakter\",\"Du bist ernsthaft und doch warmherzig. Was du versprichst, hältst du; deshalb vertrauen dir andere.\"],[\"Diese Phase\",\"Eine Arbeit, in die du lange Mühe gesteckt hast, nimmt Gestalt an. Eine kleine Beförderung oder Anerkennung kann kommen.\"],[\"Liebe und Glück\",\"Du wirst dich einem ernsthaften, verlässlichen Menschen nahe fühlen. Ihn langsam kennenzulernen tut dir gut.\"]],\"advice\":[\"Gib auch dir selbst Versprechen und halte sie.\",\"Sieh Ruhe als Bedürfnis, nicht als Belohnung.\"]}},\"ruya\":{\"about\":\"Die Traumdeutung liest die Symbole deines Traums mit der jahrhundertealten östlichen Tradition der Traumdeutung und mit den Gefühlen, die der Traum in dir geweckt hat. Albträume sind keine schlechten Omen, sondern Botschaften deiner Innenwelt. Je mehr Details du gibst, desto persönlicher die Deutung.\",\"steps\":[\"Schreib deinen Traum so ausführlich auf, wie du dich erinnerst.\",\"Die Symbole und Gefühle in deinem Traum werden einzeln betrachtet.\",\"Ich deute, was dein Traum dir sagen möchte.\"],\"learn\":[\"Die Bedeutung der Symbole in deinem Traum\",\"Die emotionale dido\",\"adLimit\":\"Ya usaste los anuncios de hoy\",\"consentNeeded\":\"Primero acepta el envío de datos\",\"lang\":\"Idioma: {x}\"},\"premium\":\"Premium\",\"premiumOnly\":\"Solo Premium\",\"premiumTitle\":\"Todo ilimitado con Premium\",\"premiumPerks\":[\"Amor, Compatibilidad, Numerología, Sueños y Quiromancia\",\"Café y tarot ilimitados\",\"Sin anuncios\",\"10 créditos de regalo cada mes\"],\"premiumCta\":\"Hazte Premium\",\"premiumActive\":\"Eres miembro Premium\",\"premiumNote\":\"Prototipo: los precios aún no están definidos.\",\"premiumLock\":\"Esta lectura es solo para miembros Premium. Con Premium tienes cinco lecturas especiales sin límite.\",\"whatIs\":\"¿Qué es?\",\"howItWorks\":\"¿Cómo funciona?\",\"youLearn\":\"Lo que descubrirás\",\"welcomeLine\":{\"one\":\"Tienes {n} lectura de bienvenida\",\"other\":\"Tienes {n} lecturas de bienvenida\"},\"welcomeSub\":\"Para café, tarot, Katina, Lectura de la estrella, En tu mente y Sí/No.\",\"priceWelcome\":\"Esta lectura usa 1 lectura de bienvenida.\",\"priceCredit\":{\"one\":\"Esta lectura cuesta {n} crédito.\",\"other\":\"Esta lectura cuesta {n} créditos.\"},\"pricePremium\":\"Ilimitada con Premium.\",\"startCta\":\"Léeme\",\"personName\":\"Nombre de la persona\",\"personRel\":\"Vuestra relación (opcional)\",\"personRelPh\":\"p. ej. ex, compañero de trabajo\",\"partnerName\":\"Su nombre\",\"partnerDate\":\"Su fecha de nacimiento\",\"motherName\":\"Nombre de tu madre\",\"motherNote\":\"En la tradición de la lectura de la estrella, el nombre de tu madre cuenta junto al tuyo.\",\"dreamLabel\":\"Cuéntame tu sueño\",\"dreamPh\":\"En mi sueño…\",\"dreamNote\":\"Escribe lugares, personas, colores y lo que sentiste; cuantos más detalles, más certera la lectura.\",\"palmLabel\":\"Foto de la palma\",\"palmShoot\":\"Fotografía tu palma\",\"palmDone\":\"Foto lista\",\"palmTip\":\"Fotografía tu mano dominante con buena luz y los dedos ligeramente separados.\",\"questionOpt\":\"Tu pregunta (opcional)\",\"questionOptPh\":\"p. ej. ¿Hacia dónde va esta relación?\",\"fromProfile\":\"Tu nombre y fecha de nacimiento vienen de tu perfil: Ayşe · 05.12.1994\",\"spreadTitle\":\"Elige tu tirada\",\"pickTitle\":{\"one\":\"Elige {n} carta\",\"other\":\"Elige {n} cartas\"},\"pickSub\":\"La baraja de 78 cartas está barajada. Cierra los ojos y toca las que te llamen.\",\"deckInfo\":\"22 Arcanos Mayores · 56 Arcanos Menores · con cartas invertidas\",\"shuffle\":\"Barajar de nuevo\",\"openCards\":\"Descubrir mis cartas\",\"adviceTitle\":\"El consejo de Kahvenaz Abla\",\"scoreLabel\":\"Puntuación de compatibilidad\",\"starLabel\":\"Tu estrella\",\"starCalc\":\"Suma abyad 838 · resto 10 al dividir entre 12\",\"reversed\":\"invertida\",\"yourCards\":\"Tus cartas\",\"needInput\":\"Primero completa los datos, querida.\",\"needPalm\":\"Primero haz una foto de tu palma.\",\"premiumOn\":\"Prototipo: Premium activado.\",\"usedWelcome\":\"Se usó una lectura de bienvenida.\",\"fal\":{\"tarot\":{\"about\":\"El tarot es una baraja de 78 cartas. Las 22 cartas de los Arcanos Mayores cuentan las grandes lecciones de la vida; las 56 de los Arcanos Menores, la vida cotidiana: Bastos para la pasión y el trabajo, Copas para los sentimientos, Espadas para los pensamientos, Oros para el dinero y la vida práctica. Una carta invertida señala una advertencia o un retraso. Las cartas no predicen el futuro con certeza: te ayudan a ver tu situación desde otro ángulo. Kahvenaz Abla baraja las cartas por ti y las lee junto con tu pregunta.\",\"steps\":[\"Elige tu tirada: 1, 3 o 7 cartas.\",\"Piensa en tu pregunta y toca las cartas que te llamen.\",\"Leo cada carta en su posición y escribo una lectura solo para ti.\"],\"learn\":[\"El pasado, el presente y el rumbo del asunto\",\"Lo que te frena y lo que te apoya\",\"Una sugerencia concreta para tu próximo paso\"],\"sample\":{\"title\":\"Esperanza, elección y luz\",\"summary\":\"Ayşe, tus cartas dicen que se cierra una etapa difícil y que tu corazón vuelve a abrirse.\",\"sections\":[[\"Pasado · La Estrella\",\"Has salido de un tiempo agotador; tu esperanza nunca se apagó. Esta carta muestra que la sanación ha empezado.\"],[\"Presente · Los Enamorados\",\"Tienes una elección por delante. Si tu cabeza y tu corazón miran al mismo lado, abrirás la puerta correcta.\"],[\"Futuro · El Sol\",\"Las próximas semanas se ven luminosas. Es probable que veas recompensado tu esfuerzo.\"]],\"advice\":[\"No precipites tu decisión, pero tampoco la aplaces para siempre.\",\"Pasa más tiempo con quienes te hacen sonreír.\"]}},\"ask\":{\"about\":\"La lectura del amor se centra solo en tu corazón. Kahvenaz Abla mira juntos tu situación sentimental, tu signo y tu pregunta para leer el rumbo de tu vida amorosa. Si estás soltera, habla del camino hacia un nuevo amor; si tienes pareja, de las fortalezas y los puntos sensibles de vuestro vínculo.\",\"steps\":[\"Tu situación sentimental y tu signo se leen de tu perfil.\",\"Si quieres, escribe en una frase lo que te inquieta.\",\"Escribo una lectura de tu vida amorosa, sección por sección.\"],\"learn\":[\"Cómo está tu corazón y qué necesita\",\"Un encuentro cercano o una nueva etapa en tu relación\",\"Formas de expresar mejor tu amor\"],\"sample\":{\"title\":\"Tu corazón está listo para una nueva página\",\"summary\":\"Ayşe, estás soltando el pasado; cuanto más ligero esté tu corazón, más fácil te será reconocer a la persona adecuada.\",\"sections\":[[\"Tu corazón\",\"Estos meses te has protegido. No es debilidad; es parte de sanar.\"],[\"Próximas semanas\",\"Una presentación entre amigos o un mensaje inesperado podría remover tu corazón.\"],[\"Ten en cuenta\",\"No compares lo nuevo con lo antiguo; conoce a quien llega por su propia historia.\"]],\"advice\":[\"Prueba a decir «sí» a las invitaciones.\",\"Escribe lo que deseas; la claridad atrae.\"]}},\"aklindaki_kisi\":{\"about\":\"En tu mente mira tu vínculo con alguien que no sale de tus pensamientos. Escribes su nombre y vuestra relación; Kahvenaz Abla lee la energía entre vosotros y el futuro cercano. Nunca afirma conocer sus sentimientos con certeza: habla de posibilidades y del paso que te corresponde.\",\"steps\":[\"Escribe el nombre de la persona.\",\"Si quieres, añade vuestra relación: ex, amigo, compañero…\",\"Leo vuestro vínculo y el futuro cercano, de forma breve y clara.\"],\"learn\":[\"Cómo está hoy vuestro vínculo\",\"Qué puede cambiar pronto entre vosotros\",\"El paso más sano para ti\"],\"sample\":{\"title\":\"Mert y tú: una frase a medias\",\"summary\":\"Entre vosotros hay palabras sin decir; los dos esperáis a que el otro dé el primer paso.\",\"sections\":[[\"Vuestro vínculo\",\"El vínculo no se ha roto, pero se ha quedado en silencio. Los recuerdos compartidos aún os ablandan.\"],[\"Futuro cercano\",\"En las próximas semanas, una ocasión pequeña, un mensaje o un amigo en común podría reabrir la conversación.\"],[\"Tu parte\",\"En vez de esperar, aclara lo que necesitas; sea cual sea la respuesta, encontrarás paz.\"]],\"advice\":[\"Sé sincera, no insistente.\",\"Cuanto más te centres en tu vida, con más claridad verás el vínculo.\"]}},\"uyum\":{\"about\":\"La compatibilidad compara los signos de dos personas, sus elementos (fuego, tierra, aire, agua) y sus números de camino de vida en numerología. La puntuación es siempre la misma para las mismas dos personas. Es para divertirse; lo valioso son vuestras fortalezas y cómo crecer juntos.\",\"steps\":[\"Tu fecha de nacimiento viene de tu perfil.\",\"Escribe su nombre y su fecha de nacimiento.\",\"Describo vuestra puntuación, fortalezas y puntos de fricción.\"],\"learn\":[\"La armonía de vuestros signos y elementos\",\"Fortalezas de la relación y posibles roces\",\"Consejos para crecer juntos\"],\"sample\":{\"title\":\"Dos fuegos, un hogar\",\"summary\":\"Ayşe (Sagitario) y Mert (Aries): ambos sois signos de fuego; la ilusión y el valor alimentan este vínculo.\",\"sections\":[[\"Vuestras fortalezas\",\"Os impulsáis mutuamente. La aventura, los viajes y los planes nuevos os acercan.\"],[\"Puntos de fricción\",\"Puede que los dos queráis la última palabra. En una discusión, elegid entender en lugar de ganar.\"],[\"Crecer juntos\",\"Haced sitio también a los momentos tranquilos; saber callar juntos también es armonía.\"]],\"advice\":[\"Planead una noche sin móvil a la semana.\",\"Hablad cuando estéis tranquilos, no en pleno enfado.\"]}},\"katina\":{\"about\":\"Katina es una baraja de símbolos que se lee para el amor en Turquía y Grecia. Kahvenaz Abla usa su propia baraja de 24 símbolos: corazón, carta, anillo, camino, llave… Siete cartas se colocan en forma de corazón; las cartas invertidas muestran la cara oculta de ese tema.\",\"steps\":[\"Si quieres, escribe tu pregunta sobre el amor.\",\"Las cartas se barajan y siete se colocan en la tirada del corazón.\",\"Leo cada carta en su lugar e interpreto tu vida amorosa.\"],\"learn\":[\"Lo que hay en tu corazón y en el suyo\",\"Vuestro vínculo, el obstáculo y la fuerza que te ayudará\",\"El futuro cercano y el resultado probable\"],\"sample\":{\"title\":\"Tu corazón y una carta\",\"summary\":\"Ayşe, la tirada dice que el amor no es de un solo lado, pero la comunicación está algo nublada.\",\"sections\":[[\"Ambos corazones · Corazón y Carta\",\"Tu corazón está abierto; del otro lado, un sentimiento espera ser dicho. Una noticia o una confesión está cerca.\"],[\"Vínculo y obstáculo · Puente, Nube invertida\",\"Se ha tendido un puente entre vosotros. La Nube invertida muestra que las preocupaciones empiezan a disiparse.\"],[\"Futuro y resultado · Camino y Anillo\",\"Aparecen un nuevo comienzo e intenciones serias; avanzad sin prisa y el vínculo se fortalecerá.\"]],\"advice\":[\"Muestra lo que sientes con un pequeño gesto.\",\"Habla de lo que deseas, no de lo que temes.\"]}},\"numeroloji\":{\"about\":\"La numerología mira el valor numérico de las letras de tu nombre y de los dígitos de tu fecha de nacimiento. Tu número del camino de vida sale de la fecha de nacimiento, el de expresión de todas las letras de tu nombre y el del alma de las vocales. El cálculo se hace en nuestro servidor con reglas fijas; Kahvenaz Abla conecta el significado de los números con tu vida.\",\"steps\":[\"Tu nombre y fecha de nacimiento vienen de tu perfil.\",\"Se calculan tus tres números principales (11, 22 y 33 se mantienen como números maestros).\",\"Interpreto cómo se manifiesta cada número en ti.\"],\"learn\":[\"El tema principal de tu camino de vida\",\"Tus talentos naturales y tu forma de expresarte\",\"Lo que tu corazón anhela de verdad\"],\"sample\":{\"title\":\"Camino de vida 4: bases sólidas\",\"summary\":\"Ayşe, tus números señalan un éxito duradero construido con esfuerzo, con un espíritu libre por dentro.\",\"sections\":[[\"Camino de vida 4\",\"Eres organizada, fiable y paciente. La gente se apoya en ti; recuerda compartir la carga a veces.\"],[\"Número de expresión 7\",\"Tienes una mente profunda y curiosa. Tus mejores ideas llegan cuando estás a solas.\"],[\"Número del alma 5\",\"Tu corazón quiere novedad y movimiento. Añade pequeñas aventuras a tu rutina.\"]],\"advice\":[\"Empieza a aprender algo nuevo este mes.\",\"Deja margen de flexibilidad en tus planes.\"]}},\"yildizname\":{\"about\":\"La lectura de la estrella (Yıldızname) es una práctica tradicional que viene de la época otomana. Se suman los valores de las letras (abyad) de tu nombre y del de tu madre y se divide entre 12; el resto indica tu estrella, es decir, tu signo y tu planeta regente. Kahvenaz Abla lee tu carácter, tu momento actual y aquello a lo que debes prestar atención.\",\"steps\":[\"Tu nombre y fecha de nacimiento vienen de tu perfil; tú añades el nombre de tu madre.\",\"Se calcula la suma abyad y se encuentra tu estrella.\",\"Interpreto tu carácter, amor, trabajo y este periodo según tu estrella.\"],\"learn\":[\"Tu estrella, tu planeta y tu elemento\",\"Los lados fuertes y sensibles de tu carácter\",\"Amor, trabajo y suerte en este periodo\"],\"sample\":{\"title\":\"Tu estrella es Capricornio, tu planeta Saturno\",\"summary\":\"Ayşe, tu estrella habla de paciencia y éxito duradero; es un tiempo en que tu esfuerzo da fruto.\",\"sections\":[[\"Tu carácter\",\"Eres seria pero de corazón cálido. Cuando prometes algo, lo cumples; por eso confían en ti.\"],[\"Este periodo\",\"Un trabajo en el que llevas tiempo esforzándote toma forma. Puede llegar un pequeño ascenso o un reconocimiento.\"],[\"Amor y suerte\",\"Te sentirás cerca de alguien serio y de confianza. Conocerlo sin prisa te hará bien.\"]],\"advice\":[\"Hazte promesas a ti misma y cúmplelas.\",\"Considera el descanso una necesidad, no un premio.\"]}},\"ruya\":{\"about\":\"La interpretación de sueños lee los símbolos de tu sueño a través de la tradición oriental centenaria y de las emociones que el sueño despertó en ti. Las pesadillas no son malos presagios, sino mensajes de tu mundo interior. Cuantos más detalles des, más personal será la lectura.\",\"steps\":[\"Escribe tu sueño con todo el detalle que recuerdes.\",\"Se exploran uno a uno los símbolos y emociones del sueño.\",\"Interpreto lo que tu sueño quiere decirte.\"],\"learn\":[\"El significado de los símbolos de tu sueño\",\"El mensaje emocional del sueño\",\"El área de tu vida que necesita atención\"],\"sample\":{\"title\":\"El mar, una llave y una puerta que se abre\",\"summary\":\"Ayşe, tu sueño dice que una solución que esperabas está cerca y que tus emociones se están calmando.\",\"sections\":[[\"El mar\",\"Un mar en calma muestra que tus emociones se asientan y tu paz interior crece.\"],[\"La llave\",\"En la tradición de los sueños, una llave significa solución y una puerta que se abre; una preocupación está por resolverse.\"],[\"El mensaje\",\"Tu subconsciente te dice que estás lista. Quizá sea el momento del paso que has ido aplazando.\"]],\"advice\":[\"Anota tus sueños nada más despertar.\",\"Ten esta semana esa conversación que vienes posponiendo.\"]}},\"el\":{\"about\":\"La quiromancia mira las líneas y los montes de tu palma: l its pas font une grande différence.\",\"Si tu hésites entre deux choix, écoute ton cœur.\",\"Ton intuition est forte ; fais confiance à ta première impression.\",\"Une belle conversation frappe à ta porte. Fais le premier pas.\",\"Tu commences à voir le fruit de tes efforts. Sois patiente.\",\"Une idée différente peut t’ouvrir une porte inattendue.\",\"Ton imagination est en éveil ; un bon jour pour commencer un projet créatif.\"],\"guide\":[[\"Retourne et attends.\",\"Bois ton café, fais un vœu, retourne la tasse sur la soucoupe ; laisse refroidir 5 à 10 minutes.\"],[\"Soigne la lumière.\",\"Photographie dans un endroit lumineux, sans flash ; pas d’ombre sur la tasse.\"],[\"Prends de haut.\",\"La tasse doit remplir le cadre et le marc être net.\"],[\"Trois photos.\",\"L’intérieur de la tasse côté gauche et côté droit, puis la soucoupe.\"]],\"symbols\":[[\"Oiseau\",\"Annonce une nouvelle ; sur le bord gauche, donc bientôt.\"],[\"Chemin\",\"Un court voyage ou un nouveau départ.\"],[\"Cœur\",\"Un sentiment que tu gardes en toi sera partagé.\"]],\"outcomes\":[\"Oui\",\"En partie\",\"Non\"],\"reasons\":[\"Inappropriée ou blessante\",\"Effrayante ou inquiétante\",\"Conseil santé, juridique ou financier\",\"Sans rapport avec moi\",\"Autre\"],\"links\":[\"Politique de confidentialité\",\"Information sur les données (KVKK)\",\"Aide et contact\",\"Supprimer mon compte\"],\"consentTitle\":\"Avant ta lecture\",\"consentText\":\"Pour rédiger tes lectures, tes photos et tes textes sont envoyés via une connexion sécurisée à notre fournisseur d’IA, Anthropic (États-Unis). Détails dans la Politique de confidentialité.\",\"consentYes\":\"J’accepte\",\"consentLater\":\"Plus tard\",\"toast\":{\"soon\":\"{x} arrive bientôt\",\"tarot\":\"Carte du jour : L’Étoile. Espoir et guérison.\",\"saved\":\"Ta lecture est prête et enregistrée dans Mes lectures\",\"noQuestion\":\"Écris d’abord ta question\",\"needCredit\":\"Il faut 1 crédit\",\"streak\":\"Reviens chaque jour : 1 crédit le 3e jour, rénom\",\"partnerDate\":\"Sa date de naissance\",\"motherName\":\"Prénom de ta mère\",\"motherNote\":\"Dans la tradition de la lecture de l'étoile, le prénom de ta mère compte avec le tien.\",\"dreamLabel\":\"Raconte-moi ton rêve\",\"dreamPh\":\"Dans mon rêve…\",\"dreamNote\":\"Écris les lieux, les personnes, les couleurs et ce que tu as ressenti ; plus il y a de détails, plus la lecture est juste.\",\"palmLabel\":\"Photo de la paume\",\"palmShoot\":\"Photographier ta paume\",\"palmDone\":\"Photo prête\",\"palmTip\":\"Photographie ta main dominante en pleine lumière, les doigts légèrement écartés.\",\"questionOpt\":\"Ta question (facultatif)\",\"questionOptPh\":\"ex. Où va cette relation ?\",\"fromProfile\":\"Ton prénom et ta date de naissance viennent de ton profil : Ayşe · 05.12.1994\",\"spreadTitle\":\"Choisis ton tirage\",\"pickTitle\":{\"one\":\"Choisis {n} carte\",\"other\":\"Choisis {n} cartes\"},\"pickSub\":\"Le jeu de 78 cartes est mélangé. Ferme les yeux et touche celles qui t’appellent.\",\"deckInfo\":\"22 Arcanes majeurs · 56 Arcanes mineurs · cartes renversées comprises\",\"shuffle\":\"Mélanger à nouveau\",\"openCards\":\"Révéler mes cartes\",\"adviceTitle\":\"Le conseil de Kahvenaz Abla\",\"scoreLabel\":\"Score de compatibilité\",\"starLabel\":\"Ton étoile\",\"starCalc\":\"Total abjad 838 · reste 10 après division par 12\",\"reversed\":\"renversée\",\"yourCards\":\"Tes cartes\",\"needInput\":\"Remplis d'abord les informations, ma chère.\",\"needPalm\":\"Prends d'abord une photo de ta paume.\",\"premiumOn\":\"Prototype : Premium activé.\",\"usedWelcome\":\"Une lecture de bienvenue a été utilisée.\",\"fal\":{\"tarot\":{\"about\":\"Le tarot est un jeu de 78 cartes. Les 22 cartes des Arcanes majeurs racontent les grandes leçons de la vie, les 56 des Arcanes mineurs la vie de tous les jours : les Bâtons pour la passion et le travail, les Coupes pour les sentiments, les Épées pour les pensées, les Deniers pour l’argent et la vie pratique. Une carte renversée signale un avertissement ou un retard. Les cartes ne prédisent pas l'avenir avec certitude : elles t'aident à voir ta situation sous un autre angle. Kahvenaz Abla mélange les cartes pour toi et les lit avec ta question.\",\"steps\":[\"Choisis ton tirage : 1, 3 ou 7 cartes.\",\"Pense à ta question et touche les cartes qui t’appellent.\",\"Je lis chaque carte à sa place et j’écris une lecture rien que pour toi.\"],\"learn\":[\"Le passé, le présent et la direction de la situation\",\"Ce qui te freine et ce qui te soutient\",\"Une suggestion concrète pour ta prochaine étape\"],\"sample\":{\"title\":\"Espoir, choix et lumière\",\"summary\":\"Ayşe, tes cartes disent qu'un chapitre difficile se referme et que ton cœur s'ouvre de nouveau.\",\"sections\":[[\"Passé · L'Étoile\",\"Tu sors d'une période épuisante ; ton espoir ne s'est jamais éteint. Cette carte montre que la guérison a commencé.\"],[\"Présent · Les Amoureux\",\"Un choix se présente. Si ta tête et ton cœur regardent dans la même direction, tu ouvriras la bonne porte.\"],[\"Futur · Le Soleil\",\"Les semaines à venir s’annoncent lumineuses. Tes efforts ont de bonnes chances d’être récompensés.\"]],\"advice\":[\"Ne précipite pas ta décision, mais ne la repousse pas indéfiniment.\",\"Passe plus de temps avec ceux qui te font sourire.\"]}},\"ask\":{\"about\":\"La lecture de l'amour se concentre uniquement sur ton cœur. Kahvenaz Abla regarde ensemble ta situation amoureuse, ton signe et ta question pour lire le cours de ta vie sentimentale. Si tu es célibataire, elle parle du chemin vers un nouvel amour ; si tu es en couple, des forces et des points sensibles de votre lien.\",\"steps\":[\"Ta situation amoureuse et ton signe sont lus dans ton profil.\",\"Si tu veux, écris ce qui te préoccupe en une phrase.\",\"J'écris une lecture de ta vie amoureuse, section par section.\"],\"learn\":[\"Comment va ton cœur et ce dont il a besoin\",\"Une rencontre proche ou un nouveau chapitre dans ta relation\",\"Des façons de mieux exprimer ton amour\"],\"sample\":{\"title\":\"Ton cœur est prêt pour une nouvelle page\",\"summary\":\"Ayşe, tu laisses le passé derrière toi ; plus ton cœur s’allège, plus il te sera facile de reconnaître la bonne personne.\",\"sections\":[[\"Ton cœur\",\"Ces derniers mois, tu t'es protégée. Ce n'est pas une faiblesse, c'est une étape de la guérison.\"],[\"Les semaines à venir\",\"Une rencontre entre amis ou un message inattendu pourrait faire battre ton cœur.\"],[\"À garder en tête\",\"Ne compare pas le nouveau à l'ancien ; découvre la personne qui arrive à travers sa propre histoire.\"]],\"advice\":[\"Essaie de dire « oui » aux invitations.\",\"Écris ce que tu désires ; la clarté attire.\"]}},\"aklindaki_kisi\":{\"about\":\"Dans tes pensées regarde ton lien avec une personne qui ne quitte pas ton esprit. Tu écris son prénom et votre lien ; Kahvenaz Abla lit l'énergie entre vous et l'avenir proche. Elle ne prétend jamais connaître ses sentiments avec certitude : elle parle de possibilités et du pas qui t'appartient.\",\"steps\":[\"Écris le prénom de la personne.\",\"Ajoute si tu veux votre lien : ex, ami, collègue…\",\"Je lis votre lien et l’avenir proche, de façon courte et claire.\"],\"learn\":[\"Où en est votre lien aujourd'hui\",\"Ce qui peut bientôt changer entre vous\",\"Le pas le plus sain pour toi\"],\"sample\":{\"title\":\"Mert et toi : une phrase inachevée\",\"summary\":\"Des mots restent non dits entre vous ; chacun attend que l'autre fasse le premier pas.\",\"sections\":[[\"Votre lien\",\"Le lien n'est pas rompu, mais il est devenu silencieux. Les souvenirs communs vous attendrissent encore tous les deux.\"],[\"Avenir proche\",\"Dans les semaines à venir, une petite occasion, un message ou un ami commun pourrait rouvrir la conversation.\"],[\"Ta part\",\"Plutôt que d’attendre, clarifie ce dont tu as besoin ; quelle que soit la réponse, tu trouveras la paix.\"]],\"advice\":[\"Sois sincère, pas insistante.\",\"Plus tu te concentres sur ta vie, plus tu vois clairement ce lien.\"]}},\"uyum\":{\"about\":\"La compatibilité compare les signes de deux personnes, leurs éléments (feu, terre, air, eau) et leurs nombres de chemin de vie en numérologie. Le score est toujours le même pour les deux mêmes personnes. Il est là pour s’amuser ; ce qui compte vraiment, ce sont vos forces et la façon de grandir ensemble.\",\"steps\":[\"Ta date de naissance vient de ton profil.\",\"Écris son prénom et sa date de naissance.\",\"Je décris votre score, vos forces et vos points de friction.\"],\"learn\":[\"L'harmonie de vos signes et de vos éléments\",\"Les forces de votre relation et les tensions possibles\",\"Des conseils pour grandir ensemble\"],\"sample\":{\"title\":\"Deux feux, un même foyer\",\"summary\":\"Ayşe (Sagittaire) et Mert (Bélier) : vous êtes tous deux des signes de feu ; l’enthousiasme et le courage nourrissent ce lien.\",\"sections\":[[\"Vos forces\",\"Vous vous stimulez l'un l'autre. L'aventure, les voyages et les nouveaux projets vous rapprochent.\"],[\"Points de friction\",\"Vous voudrez peut-être tous deux avoir le dernier mot. Dans une dispute, choisissez de comprendre plutôt que de gagner.\"],[\"Grandir ensemble\",\"Faites aussi de la place aux moments calmes ; savoir se taire ensemble, c’est aussi de l’harmonie.\"]],\"advice\":[\"Prévoyez une soirée sans téléphone par semaine.\",\"Parlez une fois calmés, pas sous le coup de la colère.\"]}},\"katina\":{\"about\":\"Katina est un jeu de symboles que l’on lit pour l’amour en Turquie et en Grèce. Kahvenaz Abla utilise son propre jeu de 24 symboles : cœur, lettre, bague, chemin, clé… Sept cartes sont disposées en forme de cœur ; les cartes renversées montrent la part d’ombre du thème.\",\"steps\":[\"Si tu veux, écris ta question sur l'amour.\",\"Les cartes sont mélangées et sept sont disposées dans le tirage du cœur.\",\"Je lis chaque carte à sa place et j’interprète ta vie amoureuse.\"],\"learn\":[\"Ce qu’il y a dans ton cœur et dans le sien\",\"Votre lien, l'obstacle et la force qui t'aidera\",\"L'avenir proche et l'issue probable\"],\"sample\":{\"title\":\"Ton cœur et une lettre\",\"summary\":\"Ayşe, le tirage dit que l'amour n'est pas à sens unique, mais que la communication est un peu nuageuse.\",\"sections\":[[\"Les deux cœurs · Cœur et Lettre\",\"Ton cœur est ouvert ; de l’autre côté, un sentiment attend d’être dit. Une nouvelle ou un aveu est proche.\"],[\"Lien et obstacle · Pont, Nuage renversé\",\"Un pont s’est formé entre vous. Le Nuage renversé montre que les inquiétudes commencent à se dissiper.\"],[\"Avenir et issue · Chemin et Bague\",\"Un nouveau départ et des intentions sérieuses apparaissent ; avancez sans hâte et le lien se renforcera.\"]],\"advice\":[\"Montre tes sentiments par un petit geste.\",\"Parle de ce que tu veux, pas de ce que tu crains.\"]}},\"numeroloji\":{\"about\":\"La numérologie regarde la valeur numérique des lettres de ton prénom et des chiffres de ta date de naissance. Ton chemin de vie vient de ta date de naissance, ton nombre d’expression de toutes les lettres de ton prénom et ton nombre intime des voyelles. Le calcul est fait sur notre serveur selon des règles fixes ; Kahvenaz Abla relie le sens des nombres à ta vie.\",\"steps\":[\"Ton prénom et ta date de naissance viennent de ton profil.\",\"Tes trois nombres principaux sont calculés (11, 22 et 33 restent des nombres maîtres).\",\"J’interprète la façon dont chaque nombre se manifeste en toi.\"],\"learn\":[\"Le thème principal de ton chemin de vie\",\"Tes talents naturels et ta façon de t’exprimer\",\"Ce à quoi ton cœur aspire vraiment\"],\"sample\":{\"title\":\"Chemin de vie 4 : des bases solides\",\"summary\":\"Ayşe, tes nombres annoncent une réussite durable construite par l’effort, avec un esprit libre à l’intérieur.\",\"sections\":[[\"Chemin de vie 4\",\"Tu es organisée, fiable et patiente. Les autres s'appuient sur toi ; pense à partager la charge de temps en temps.\"],[\"Nombre d'expression 7\",\"Tu as un esprit profond et curieux. Tes meilleures idées viennent quand tu es seule.\"],[\"Nombre intime 5\",\"Ton cœur veut de la nouveauté et du mouvement. Ajoute de petites aventures à ta routine.\"]],\"advice\":[\"Commence à apprendre quelque chose de nouveau ce mois-ci.\",\"Laisse de la souplesse dans tes projets.\"]}},\"yildizname\":{\"about\":\"La lecture de l'étoile (Yıldızname) est une pratique traditionnelle héritée de l'époque ottomane. Les valeurs des lettres (abjad) de ton prénom et de celui de ta mère sont additionnées puis divisées par 12 ; le reste donne ton étoile, c'est-à-dire ton signe et ta planète. Kahvenaz Abla lit à travers cette étoile ton caractère, ta période actuelle et ce à quoi tu dois faire attention.\",\"steps\":[\"Ton prénom et ta date de naissance viennent de ton profil ; tu ajoutes le prénom de ta mère.\",\"Le total abjad est calculé et ton étoile est trouvée.\",\"J'interprète ton caractère, l'amour, le travail et cette période selon ton étoile.\"],\"learn\":[\"Ton étoile, ta planète et ton élément\",\"Les côtés forts et sensibles de ton caractère\",\"L'amour, le travail et la chance en cette période\"],\"sample\":{\"title\":\"Ton étoile est le Capricorne, ta planète Saturne\",\"summary\":\"Ayşe, ton étoile parle de patience et de réussite durable ; c’est le moment où tes efforts portent leurs fruits.\",\"sections\":[[\"Ton caractère\",\"Tu es sérieuse mais chaleureuse. Quand tu promets, tu tiens parole ; c’est pourquoi on te fait confiance.\"],[\"Cette période\",\"Un travail dans lequel tu investis depuis longtemps prend forme. Une petite promotion ou une reconnaissance peut arriver.\"],[\"Amour et chance\",\"Tu te sentiras proche d'une personne sérieuse et fiable. Prendre le temps de la connaître te fera du bien.\"]],\"advice\":[\"Fais-toi aussi des promesses et tiens-les.\",\"Vois le repos comme un besoin, pas comme une récompense.\"]}},\"ruya\":{\"about\":\"L'interprétation des rêves lit les symboles de ton rêve à travers la tradition orientale séculaire et les émotions que le rêve a éveillées en toi. Les cauchemars ne sont pas de mauvais présages, mais des messages de ton monde intérieur. Plus tu donnes de détails, plus la lecture est personnelle.\",\"steps\":[\"Écris ton rêve avec autant de détails que tu t’en souviens.\",\"Les symboles et les émotions de ton rêve sont explorés un par un.\",\"J'interprète ce que ton rêve veut te dire.\"],\"learn\":[\"Le sens des symboles de ton rêve\",\"Le message émotionnel du rêve\",\"Le domaine de ta vie qui demande de l'attention\"],\"sample\":{\"title\":\"La mer, une clé et une porte qui s’ouvre\",\"summary\":\"Ayşe, ton rêve dit qu’une solution longtemps attendue approche et que tes émotions s’apaisent.\",\"sections\":[[\"La mer\",\"Une mer calme montre que tes émotions se posent et que ta paix intérieure grandit.\"],[\"La clé\",\"Dans la tradition des rêves, une clé signifie une solution et une porte qui s'ouvre ; un souci est sur le point de se régler.\"],[\"Le message\",\"Ton inconscient te dit que tu es prête. C'est peut-être le moment du pas que tu repousses.\"]],\"advice\":[\"Note tes rêves dès le réveil.\",\"Aie cette semaine la conversation que tu remets à plus tard.\"]}},\"el\":{\"about\":\"La chiromancie regarde les lignes et les monts de ta paume : lignes de vie, de tête, de cœur et de destinée. La ligne de vie n’indique pas combien de temps tu vivras ; elle décrit ton énergie et ton mode de vie. Kahvenaz Abla ne lit que les lignes qu’elle voit réellement sur la photo.\",\"steps\":[\"Photographie la paume de ta main dominante en pleine lumière.\",\"La netteté de la photo est vérifiée ; si elle est floue, la lecture n'est pas décomptée.\",\"Je lis une à une les lignes et les monts visibles.\"],\"learn\":[\"Ce que racontent tes lignes de vie, de tête, de cœur et de destinée\",\"Ton caractère et ton style émotionnel\",\"Des indices pour la période à venir\"],\"sample\":{\"title\":\"Une ligne de cœur profonde, une main déterminée\",\"summary\":\"Ayşe, ta paume décrit quelqu’un لي: تم تفعيل Premium.\",\"usedWelcome\":\"تم استخدام قراءة ترحيبية.\",\"fal\":{\"tarot\":{\"about\":\"التاروت مجموعة من 78 بطاقة. تحكي بطاقات الأركانا الكبرى الاثنتان والعشرون دروس الحياة الكبيرة، وتحكي بطاقات الأركانا الصغرى الست والخمسون الحياة اليومية: العصي للشغف والعمل، والكؤوس للمشاعر، والسيوف للأفكار، والعملات للمال والحياة العملية. والبطاقة المقلوبة تشير إلى تنبيه أو تأخير. لا تتنبأ البطاقات بالمستقبل يقينًا، بل تساعدكِ على رؤية وضعكِ من زاوية جديدة. تخلط Kahvenaz Abla البطاقات لكِ وتقرؤها مع سؤالكِ.\",\"steps\":[\"اختاري طريقة الفرد: بطاقة أو 3 أو 7 بطاقات.\",\"فكّري في سؤالكِ والمسي البطاقات التي تناديكِ.\",\"أقرأ كل بطاقة في موضعها وأكتب قراءة خاصة بكِ.\"],\"learn\":[\"ماضي الأمر وحاضره واتجاهه\",\"ما يعيقكِ وما يسندكِ\",\"اقتراحًا عمليًا لخطوتكِ التالية\"],\"sample\":{\"title\":\"أمل واختيار ونور\",\"summary\":\"Ayşe، تقول بطاقاتكِ إن مرحلة صعبة تُغلق وإن قلبكِ ينفتح من جديد.\",\"sections\":[[\"الماضي · النجمة\",\"خرجتِ من فترة متعبة، ولم ينطفئ أملكِ أبدًا. تُظهر هذه البطاقة أن الشفاء قد بدأ.\"],[\"الحاضر · العشّاق\",\"أمامكِ اختيار. حين ينظر عقلكِ وقلبكِ في الاتجاه نفسه ستفتحين الباب الصحيح.\"],[\"المستقبل · الشمس\",\"الأسابيع القادمة مشرقة، ومن المرجح أن تري ثمرة تعبكِ.\"]],\"advice\":[\"لا تتعجّلي قراركِ، ولا تؤجليه إلى الأبد.\",\"امنحي وقتًا أطول لمن يرسمون الابتسامة على وجهكِ.\"]}},\"ask\":{\"about\":\"تركّز قراءة الحب على قلبكِ وحده. تنظر Kahvenaz Abla إلى حالتكِ العاطفية وبرجكِ وسؤالكِ معًا لتقرأ مسار حياتكِ العاطفية. إن كنتِ عزباء تحدثكِ عن الطريق إلى حب جديد، وإن كنتِ في علاقة تحدثكِ عن نقاط قوة رابطكما ومواضع حساسيته.\",\"steps\":[\"تُقرأ حالتكِ العاطفية وبرجكِ من ملفكِ.\",\"إن شئتِ اكتبي ما يشغلكِ في جملة واحدة.\",\"أكتب قراءة لحياتكِ العاطفية قسمًا بعد قسم.\"],\"learn\":[\"حال قلبكِ الآن وما يحتاج إليه\",\"لقاء قريب أو مرحلة جديدة في علاقتكِ\",\"طرقًا لتعبّري عن حبكِ بشكل أفضل\"],\"sample\":{\"title\":\"قلبكِ مستعد لصفحة جديدة\",\"summary\":\"Ayşe، أنتِ تتركين الماضي خلفكِ، وكلما خفّ قلبكِ سهُل عليكِ أن تري الشخص المناسب.\",\"sections\":[[\"حال قلبكِ\",\"في الأشهر الأخيرة كنتِ تحمين نفسكِ. هذا ليس ضعفًا، بل جزء من الشفاء.\"],[\"الأسابيع القادمة\",\"قد يحرّك قلبكِ تعارفٌ بين الأصدقاء أو رسالة غير متوقعة.\"],[\"انتبهي إلى\",\"لا تقارني الجديد بالقديم؛ تعرّفي إلى القادم من خلال قصته هو.\"]],\"advice\":[\"جرّبي أن تقولي «نعم» للدعوات.\",\"اكتبي ما تريدينه؛ الوضوح يجذب.\"]}},\"aklindaki_kisi\":{\"about\":\"تنظر قراءة «من في بالكِ» إلى رابطكِ بشخص لا يغيب عن أفكاركِ. تكتبين اسمه وعلاقتكِ به، فتقرأ Kahvenaz Abla الطاقة بينكما والمستقبل القريب. لا تدّعي أبدًا أنها تعرف مشاعره يقينًا، بل تتحدث عن الاحتمالات وعن الخطوة التي تخصّكِ.\",\"steps\":[\"اكتبي اسم الشخص.\",\"أضيفي إن شئتِ علاقتكِ به: حبيب سابق، صديق، زميل…\",\"أقرأ الرابط بينكما والمستقبل القريب باختصار ووضوح.\"],\"learn\":[\"حال الرابط بينكما اليوم\",\"ما قد يتغير بينكما قريبًا\",\"الخطوة الأكثر راحة لكِ\"],\"sample\":{\"title\":\"Mert وأنتِ: جملة لم تكتمل\",\"summary\":\"بينكما كلمات لم تُقل، وكلٌّ منكما ينتظر أن يبدأ الآخر.\",\"sections\":[[\"الرابط بينكما\",\"لم ينقطع الرابط لكنه صار صامتًا. ما زالت الذكريات المشتركة تليّن قلبيكما.\"],[\"المستقبل القريب\",\"في الأسابيع القادمة قد تعيد مناسبة صغيرة أو رسالة أو صديق مشترك فتح الحديث.\"],[\"ما يخصّكِ\",\"بدل الانتظار، حدّدي ما تحتاجين إليه؛ أيًّا كان الجواب ستجدين راحتكِ.\"]],\"advice\":[\"كوني صادقة لا مُلحّة.\",\"كلما ركّزتِ على حياتكِ رأيتِ الرابط بوضوح أكبر.\"]}},\"uyum\":{\"about\":\"تقارن قراءة التوافق بين برجي شخصين وعنصريهما (النار والتراب والهواء والماء) ورقمي مسار الحياة في علم الأرقام. تكون الدرجة نفسها دائمًا للشخصين أنفسهما، وهي للتسلية؛ أما القيمة الحقيقية ففي نقاط قوتكما وكيف تنموان معًا.\",\"steps\":[\"يُؤخذ تاريخ ميلادكِ من ملفكِ.\",\"اكتبي اسمه وتاريخ ميلاده.\",\"أصف درجة توافقكما ونقاط قوتكما ومواضع الاحتكاك.\"],\"learn\":[\"انسجام برجيكما وعنصريكما\",\"نقاط قوة علاقتكما وما قد يسبب الخلاف\",\"نصائح لتنموا معًا\"],\"sample\":{\"title\":\"ناران وموقد واحد\",\"summary\":\"Ayşe (القوس) وMert (الحمل): كلاكما من برج ناري، والحماس والشجاعة وقود هذا الرابط.\",\"sections\":[[\"نقاط قوتكما\",\"يحفّز كل منكما الآخر. المغامرة والسفر والخطط الجديدة تقرّبكما.\"],[\"مواضع الاحتكاك\",\"قد يرغب كلاكما في قول الكلمة الأخيرة. في الخلاف اختارا الفهم بدل الانتصار.\"],[\"أن تنموا معًا\",\"افسحا مكانًا للحظات الهادئة أيضًا؛ فالقدرة على الصمت معًا انسجام أيضًا.\"]],\"advice\":[\"خصّصا أمسية أسبوعية بلا هاتف.\",\"تحدّثا بعد أن تهدآ لا في لحظة الغضب.\"]}},\"katina\":{\"about\":\"كاتينا مجموعة رموز تُقرأ للحب في تركيا واليونان. تستخدم Kahvenaz Abla مجموعتها الخاصة من 24 رمزًا: القلب والرسالة والخاتم والطريق والمفتاح… تُفرد سبع بطاقات على شكل قلب، وتُظهر البطاقات المقلوبة الجانب الخفي من الموضوع.\",\"steps\":[\"إن شئتِ اكتبي سؤالكِ عن الحب.\",\"تُخلط البطاقات وتُفرد سبع منها في فرد القلب.\",\"أقرأ كل بطاقة في مكانها وأفسّر حياتكِ العاطفية.\"],\"learn\":[\"ما في قلبكِ وما في قلبه\",\"الرابط بينكما والعائق والقوة التي ستساعدكِ\",\"المستقبل القريب والنتيجة المحتملة\"],\"sample\":{\"title\":\"قلبكِ ورسالة\",\"summary\":\"Ayşe، يقول الفرد إن الحب ليس من طرف واحد، لكن التواصل غائم قليلًا.\",\"sections\":[[\"القلبان · القلب والرسالة\",\"قلبكِ منفتح، وفي الطرف الآخر شعور ينتظر أن يُقال. خبرٌ أو اعتراف قريب.\"],[\"الرابط والعائق · الجسر والغيمة المقلوبة\",\"امتدّ بينكما جسر. وتُظهر الغيمة المقلوبة أن القلق بدأ يتبدد.\"],[\"المستقبل والنتيجة · الطريق والخاتم\",\"تظهر بداية جديدة ونية جادة؛ إن تقدّمتما دون عجلة يقوى الرابط.\"]],\"advice\":[\"عبّري عن شعوركِ بلفتة صغيرة.\",\"تحدّثي عمّا تريدينه لا عمّا تخافينه.\"]}},\"numeroloji\":{\"about\":\"ينظر علم الأرقام إلى القيم العددية لحروف اسمكِ وأرقام تاريخ ميلادكِ. يُستخرج رقم مسار الحياة من تاريخ الميلاد، ورقم التعبير من جميع حروف الاسم، ورقم الروح من حروف المد. يجري الحساب على خادمنا بقواعد ثابتة، وتربط Kahvenaz Abla معاني الأرقام بحياتكِ.\",\"steps\":[\"يُؤخذ اسمكِ وتاريخ ميلادكِ من ملفكِ.\",\"تُحسب أرقامكِ الثلاثة الأساسية (وتبقى 11 و22 و33 أرقامًا رئيسية).\",\"أفسّر كيف يظهر كل رقم فيكِ.\"],\"learn\":[\"الموضوع الأساسي في رحلة حياتكِ\",\"مواهبكِ الطبيعية وطريقة تعبيركِ\",\"ما يتوق إليه قلبكِ حقًا\"],\"sample\":{\"title\":\"مسار الحياة 4: أسس متينة\",\"summary\":\"Ayşe، تشير أرقامكِ إلى نجاح دائم يُبنى بالجهد، وفي داخلكِ روح تحب الحرية.\",\"sections\":[[\"مسار الحياة 4\",\"أنتِ منظّمة وموثوقة وصبورة. يستند إليكِ الآخرون؛ لا تنسي أن تتقاسمي الحمل أحيانًا.\"],[\"رقم التعبير 7\",\"لديكِ عقل عميق يسأل. تأتيكِ أفضل أفكاركِ حين تكونين وحدكِ.\"],[\"رقم الروح 5\",\"قلبكِ يريد التجديد والحركة. أضيفي مغامرات صغيرة إلى روتينكِ.\"]],\"advice\":[\"ابدئي بتعلّم شيء جديد هذا الشهر.\",\"اتركي مساحة للمرونة في خططكِ.\"]}},\"yildizname\":{\"about\":\"قراءة النجم (Yıldızname) ممارسة تقليدية تعود إلى العهد العثماني. تُجمع القيم الأبجدية لحروف اسمكِ واسم والدتكِ ثم تُقسم على 12، فيدلّ الباقي على نجمكِ أي برجكِ وكوكبكِ. تقرأ Kahvenaz Abla من خلال هذا النجم شخصيتكِ ومرحلتكِ الحالية وما يجب أن تنتبهي إليه.\",\"steps\":[\"يُؤخذ اسمكِ وتاريخ ميلادكِ من ملفكِ، وتضيفين اسم والدتكِ.\",\"يُحسب مجموع الأبجد ويُعرف نجمكِ.\",\"أفسّر شخصيتكِ وحبكِ وعملكِ وهذه المرحلة وفق نجمكِ.\"],\"learn\":[\"نجمكِ وكوكبكِ وعنصركِ\",\"جوانب القوة والحساسية في شخصيتكِ\",\"الحب والعمل والحظ في هذه المرحلة\"],\"sample\":{\"title\":\"نجمكِ الجدي وكوكبكِ زحل\",\"summary\":\"Ayşe، يتحدث نجمكِ عن الصبر والنجاح الدائم؛ إنه وقت يُثمر فيه تعبكِ.\",\"sections\":[[\"شخصيتكِ\",\"أنتِ رزينة لكن قلبكِ دافئ. إذا وعدتِ وفيتِ، ولهذا يثق بكِ الناس.\"],[\"هذه المرحلة\",\"عملٌ بذلتِ فيه جهدًا طويلًا يتضح الآن. قد تأتي ترقية صغيرة أو تقدير.\"],[\"الحب والحظ\",\"ستشعرين بقرب من شخص جادّ وموثوق. التعرّف إليه دون عجلة سيريحكِ.\"]],\"advice\":[\"عِدي نفسكِ أيضًا وأوفي بوعدكِ.\",\"اعتبري الراحة حاجة لا مكافأة.\"]}},\"ruya\":{\"about\":\"يقرأ تفسير الأحلام رموز حلمكِ وفق تقليد التعبير الشرقي العريق ووفق المشاعر التي أيقظها الحلم فيكِ. الكوابيس ليست نذير شؤم بل رسائل من عالمكِ الداخلي. كلما زادت التفاصيل صار التفسير أقرب إليكِ.\",\"steps\":[\"اكتبي حلمكِ بأكبر قدر تتذكرينه من التفاصيل.\",\"تُتناول رموز الحلم ومشاعره واحدًا واحدًا.\",\"أفسّر ما يريد حلمكِ أن يقوله لكِ.\"],\"learn\":[\"معاني الرموز في حلمكِ\",\"الرسالة العاطفية للحلم\",\"جانب حياتكِ الذي يحتاج إلى انتباه\"],\"sample\":{\"title\":\"البحر ومفتاح وباب يُفتح\",\"summary\":\"Ayşe، يقول حلمكِ إن حلًا طال انتظاره يقترب وإن مشاعركِ تهدأ.\",\"sections\":[[\"البحر\",\"البحر الهادئ يدل على أن مشاعركِ تستقر وأن سلامكِ الداخلي يزداد.\"],[\"المفتاح\",\"في تقليد التعبير يعني المفتاح الحلّ وبابًا يُفتح؛ همٌّ على وشك أن ينجلي.\"],[\"رسالة الحلم\",\"يقول لكِ عقلكِ الباطن إنكِ مستعدة. ربما حان وقت الخطوة التي أجّلتِها.\"]],\"advice\":[\"دوّني أحلامكِ فور استيقاظكِ.\",\"أجري هذا الأسبوع الحديث الذي تؤجلينه.\"]}},\"el\":{\"about\":\"تنظر قراءة الكف إلى خطوط باطن اليد وتلالها: خط الحياة وخط العقل وخط القلب وخط القدر. لا يدل خط الحياة على طول العمر، بل يصف طاقتكِ وأسلوب حياتكِ. لا تقرأ Kahvenaz Abla إلا الخطوط التي تراها فعلًا في الصورة.\",\"steps\":[\"صوّري باطن يدكِ التي تستخدمينها أكثر في إضاءة جيدة.\",\"يُتحقق من وضوح الصورة، وإن لم تكن واضحة لا تُحتسب القراءة.\",\"أقرأ الخطوط والتلال الظاهرة واحدًا واحدًا.\"],\"learn\":[\"ما تقوله خطوط الحياة والعقل والقلب والقدر\",\"شخصيتكِ وأسلوبكِ العاطفي\",\"إشارات للمرحلة القادمة\"],\"sample\":{\"title\":\"خط قلب عميق ويد حازمة\",\"summary\":\"Ayşe، تصف كفّكِ شخصًا يشعر بعمق لكنه يقرّر بعقل صافٍ.\",\"sections\":[[\"خط القلب\",\"خط قلبكِ الطويل المنحني يدل على طبع وفيّ يُظهر الحب بصراحة.\"],[\"خط العقل\",\"خط عقلكِ المستقيم الواضح يدل على تفكير عملي وحب للتخطيط.\"],[\"خط الحياة\",\"يرسم قوسًا واسعًا: طاقتكِ عالية وأنتِ منفتحة على التجارب الجديدة.\"]],\"advice\":[\"لا تتردّدي في التعبير عن مشاعركِ بالكلمات.\",\"وجّهي طاقتكِ إلى هواية أو رياضة.\"]}}},\"tarotSpreads\":[[\"بطاقة اليوم · بطاقة واحدة\",\"طاقة اليوم ورسالة قصيرة لكِ.\"],[\"الماضي والحاضر والمستقبل · 3 بطاقات\",\"تُظهر من أين جاء الأمر وإلى أين يتجه.\"],[\"النجوم السبع · 7 بطاقات\",\"الوضع والعائق والتأثير الخفي والنصيحة والنتيجة المحتملة: أكثر الطرق تفصيلًا.\"]],\"tarotPositions7\":[\"الماضي\",\"الحاضر\",\"المستقبل\",\"العائق\",\"التأثير الخفي\",\"النصيحة\",\"النتيجة المحتملة\"],\"tarotCards\":[[\"النجمة\",\"الأمل، الشفاء\"],[\"العشّاق\",\"الاختيار، رابط المحبة\"],[\"الشمس\",\"الفرح، النو
